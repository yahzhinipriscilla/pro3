<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body bgcolor="#aad563" align="center">

    <form action="/submit-registration" method="POST">
        
        <h2 align="center">Create an Account
        <p>Please fill out this form to register.</p>
        <hr>

        <div>
            <label for="fullname">Full Name:</label>
            <input 
                type="text" 
                id="fullname" 
                name="fullname" 
                placeholder="Stacy Wilkins" 
                required
                autocomplete="name">
        </div>

        <div>
            <label for="email">Email Address:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="eco@example.com" 
                required
                autocomplete="email">
        </div>

        <div>
            <label for="password">Password:</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="At least 8 characters" 
                minlength="8" 
                required
                autocomplete="new-password">
        </div>

        <div>
            <label>
                <input type="checkbox" name="terms" required> 
                I agree to the Terms & Conditions
            </label>
        </div>

        
        <div>
            <button type="submit">Sign Up</button>
        </div>

        
        <div>
            <p>Already have an account? <a href="PRO3.html">Log in here</a>.</p>
        </div></h2>

    </form>

</body>
</html>
